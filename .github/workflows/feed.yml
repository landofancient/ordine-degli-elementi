name: Aggiorna feed e foto
on:
  push:
    paths: ["data/events.json", "scripts/**", "assets/foto/**"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_feed.py
      - run: python3 scripts/build_photos.py
      - run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add feed.xml data/photos.json
          git diff --cached --quiet || (git commit -m "Aggiorna feed e foto" && git push)
